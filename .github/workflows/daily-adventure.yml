name: Daily adventure

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate today's quest
        run: node scripts/update-daily.mjs
      - name: Commit when the quest changed
        run: |
          if git diff --quiet; then
            echo "No update needed"
            exit 0
          fi
          git config user.name "life-adventure-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily.json
          git commit -m "chore: refresh daily adventure"
          git push
